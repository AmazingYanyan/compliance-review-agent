services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - pg_data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-8080}:8000"
    volumes:
      - app_files:/data

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - app_files:/data

volumes:
  pg_data:
  app_files:
