name: credit-review-v2
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: credit_review_v2
      POSTGRES_USER: credit_review_v2
      POSTGRES_PASSWORD: ${V2_DB_PASSWORD:?Set V2_DB_PASSWORD in a V2 environment}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "credit_review_v2", "-d", "credit_review_v2"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pg_data:
  app_files:
